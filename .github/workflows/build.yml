name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core + integration (real MeshCentral in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Pull images
        run: for i in ghcr.io/ylianst/meshcentral:latest node:22-alpine debian:12-slim eclipse-temurin:21-jdk; do docker pull -q "$i"; done
      - name: Tests
        run: tests/server/run-integration.sh "$RUNNER_TEMP/meshtest"

  app:
    name: App (lint, debug and release builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint and build
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: meshclient-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
